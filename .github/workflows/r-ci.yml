name: R CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly to check for dependency updates
    - cron: '0 0 * * 0'
  workflow_dispatch:

# Minimal permissions for GITHUB_TOKEN
permissions:
  contents: read

jobs:
  lint:
    name: Lint R Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
          
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: lintr
          
      - name: Run lintr
        run: |
          lintr::lint_dir(linters = lintr::linters_with_defaults(
            line_length_linter = lintr::line_length_linter(120L),
            object_name_linter = NULL
          ))
        shell: Rscript {0}

  test:
    name: Test R Code
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: '4.3.2'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: macos-latest, r: '4.3.2'}
          - {os: windows-latest, r: '4.3.2'}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::testthat
          needs: check
          
      - name: Run tests
        run: |
          testthat::test_dir("tests/testthat", reporter = "summary")
        shell: Rscript {0}
        continue-on-error: true

  run-pipeline:
    name: Run Analysis Pipeline
    runs-on: ubuntu-latest
    needs: [lint]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
          
      - uses: r-lib/actions/setup-r-dependencies@v2
        
      - name: Create output directories
        run: |
          mkdir -p Logs Output Processed_Data Plots Models Final_Results
          
      - name: Run 01 - Load and EDA
        run: Rscript 01_load_and_eda.R
        
      - name: Run 02 - Merge Datasets
        run: Rscript 02_merge_datasets.R
        
      - name: Run 03 - Prepare Modeling DataFrame
        run: Rscript 03_prepare_modeling_df.R
        
      - name: Run 04 - ARIMA Modeling
        run: Rscript 04_arima_modeling.R
        
      - name: Run 05 - Regularization Modeling
        run: Rscript 05_regularization_modeling.R
        
      - name: Run 06 - Model Evaluation
        run: Rscript 06_model_evaluation.R
        
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: |
            Final_Results/
            Plots/
            Models/
          retention-days: 30
          
      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: Logs/
          retention-days: 7

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [run-pipeline]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pakistan-inflation-forecast:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
