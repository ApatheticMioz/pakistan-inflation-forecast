# Pakistan Inflation Forecasting Project Configuration
# This file contains all configurable parameters for the analysis pipeline

# Data Configuration
data:
  # Input data directories
  main_data_dir: "Data"
  combined_data_dir: "Data/data_combined"
  easydata_dir: "Data/easydata"
  fao_dir: "Data/fao"
  fred_dir: "Data/fred"
  finance_dir: "Data/finanaceGovPk"
  old_data_dir: "Data/old_data"
  
  # Output directories
  output_dir: "Output"
  processed_data_dir: "Processed_Data"
  plots_dir: "Plots"
  logs_dir: "Logs"
  models_dir: "Models"
  final_results_dir: "Final_Results"
  
  # Missing value strings recognized in data files
  na_strings:
    - "NA"
    - "N/A"
    - "n/a"
    - "#"
    - "."
    - "-"
    - ""
    - "NULL"
    - "null"
    - "MISSING"
    - "missing"

# Model Configuration
model:
  # Train-test split ratio
  train_ratio: 0.80
  
  # Cross-validation folds
  cv_folds: 10
  
  # Random seed for reproducibility
  seed: 123
  
  # Forecast horizon (in months)
  forecast_horizon: 12
  
  # Confidence levels for prediction intervals
  confidence_levels:
    - 0.80
    - 0.95
  
  # ARIMA settings
  arima:
    seasonal: true
    stepwise: true
    approximation: false
    
  # Regularization settings
  regularization:
    # Alpha values to test for Elastic Net
    elastic_net_alpha_range:
      start: 0.1
      end: 0.9
      step: 0.1
    
    # Lambda selection method ("min" or "1se")
    lambda_selection: "1se"

# Feature Engineering Configuration
features:
  # Lag periods for time series features
  lag_periods:
    - 1
    - 3
    - 6
    - 12
  
  # Moving average windows
  ma_windows:
    - 3
    - 6
    - 12
  
  # Correlation threshold for feature selection
  correlation_threshold: 0.3
  
  # Outlier detection IQR multiplier
  outlier_iqr_multiplier: 3.0
  
  # Maximum missingness threshold (drop variables with higher missingness)
  max_missingness_threshold: 0.30

# Visualization Configuration
visualization:
  # Plot dimensions
  plot_width: 1000
  plot_height: 600
  plot_dpi: 100
  
  # Theme
  theme: "minimal"
  
  # Color palette
  colors:
    primary: "#1f77b4"
    secondary: "#ff7f0e"
    tertiary: "#2ca02c"
    actual: "black"
    forecast: "blue"
    confidence_interval: "gray"

# Logging Configuration
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR)
  level: "INFO"
  
  # Include timestamp in log messages
  include_timestamp: true
  
  # Log file format
  date_format: "%Y-%m-%d %H:%M:%S"

# Pakistan-specific Configuration
pakistan:
  # Fiscal year start month (July)
  fiscal_year_start_month: 7
  
  # Ramadan dates for calendar effects (approximate start dates)
  ramadan_dates:
    2020: "2020-04-24"
    2021: "2021-04-13"
    2022: "2022-04-02"
    2023: "2023-03-23"
    2024: "2024-03-11"
    2025: "2025-03-01"
